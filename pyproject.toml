[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blockjail"
version = "0.1.0"
description = "Tiny local jailbreak / prompt-injection gate for solo apps. No stego stack, no API key."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SamsonCyber" }]
keywords = ["jailbreak", "prompt-injection", "llm", "safety", "guardrail"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
blockjail = "blockjail.cli:main"

[project.urls]
Homepage = "https://github.com/SamsonCyber/blockjail"
Repository = "https://github.com/SamsonCyber/blockjail"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
